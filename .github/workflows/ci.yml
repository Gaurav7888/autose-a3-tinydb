name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to test
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test
        id: tests
        run: python -m pytest -q -o addopts= --tb=line --ignore=experiment --ignore=workflow --ignore=architecture
      - name: Commit status
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.tests.outcome }}" = "success" ]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${{ inputs.sha }}" \
            -f state="$state" \
            -f context="ci/pytest" \
            -f description="pytest on Python 3.12"
