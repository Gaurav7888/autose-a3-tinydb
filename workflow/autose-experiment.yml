name: autose-experiment

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: autose-experiment
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        seed: [good, bool-bug, dependency, noop, lying-test]
        context: [blind, trace]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: seed/${{ matrix.seed }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: Review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
        run: |
          python workflow/agent/run.py review \
            --repo pr \
            --issue-file "experiment/seeded_prs/${{ matrix.seed }}/issue.md" \
            --issue-title "${{ matrix.seed }}" \
            --context "${{ matrix.context }}" \
            --excuse "experiment/seeded_prs/${{ matrix.seed }}/excuse.md" \
            --base master \
            --artifacts "artifacts/${{ matrix.seed }}-${{ matrix.context }}"
      - name: Post the variant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="$(gh pr list --head "seed/${{ matrix.seed }}" --json number --jq '.[0].number')"
          gh pr comment "$pr" --body-file "artifacts/${{ matrix.seed }}-${{ matrix.context }}/review.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-${{ matrix.seed }}-${{ matrix.context }}
          path: artifacts/${{ matrix.seed }}-${{ matrix.context }}/review.md
          if-no-files-found: warn
